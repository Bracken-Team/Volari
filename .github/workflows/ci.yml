name: Volari CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[gui,test]"
        pip install ruff pytest

    - name: Lint with ruff
      run: |
        ruff check volatility_gui/ --select=F,E,W --ignore=E501

    - name: Run tests
      run: |
        pytest tests/ -v

  build:
    name: Build ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: Volari.app
            artifact_path: dist/Volari.app
          - os: windows-latest
            artifact_name: Volari.exe
            artifact_path: dist/Volari.exe
          - os: ubuntu-latest
            artifact_name: Volari-Linux
            artifact_path: dist/Volari

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[gui]"
        pip install pyinstaller

    - name: Install Linux display dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0 libegl1

    - name: Build with PyInstaller
      run: |
        pyinstaller volari.spec --clean --noconfirm

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_path }}
        retention-days: 14

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create macOS DMG
      run: |
        # Package macOS app into DMG
        hdiutil create -volname "Volari" -srcfolder Volari.app -ov -format UDZO Volari.dmg || true

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Volari.app/**
          Volari.exe/**
          Volari-Linux/**
          Volari.dmg
        draft: true
        generate_release_notes: true
